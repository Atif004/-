<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>أكّد بريدك الإلكتروني</title></head>
<body style="margin:0;padding:0;background:#f4f1ea;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#0a0e1a;border-radius:20px;overflow:hidden;">
        <tr><td style="padding:32px 28px 8px;text-align:right;font-family:-apple-system,'SF Arabic','Geeza Pro',Tahoma,Arial,sans-serif;">
          <div style="font-size:30px;font-weight:800;color:#c9a86a;">قُدرة</div>
        </td></tr>
        <tr><td dir="rtl" style="padding:8px 28px 8px;text-align:right;font-family:-apple-system,'SF Arabic','Geeza Pro',Tahoma,Arial,sans-serif;color:#f5f3ee;">
          <h1 style="font-size:22px;margin:16px 0 8px;color:#f5f3ee;">أكّد بريدك الإلكتروني</h1>
          <p style="font-size:16px;line-height:1.8;margin:0 0 24px;color:#c9ced8;">شكرًا لتسجيلك في «قُدرة». اضغط الزر أدناه لتأكيد بريدك الإلكتروني <span dir="ltr" style="unicode-bidi:embed;color:#e6cf9a;">{{ .Email }}</span> وتفعيل حسابك.</p>
          <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:14px;background:#c9a86a;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:700;color:#0a0e1a;text-decoration:none;font-family:-apple-system,'SF Arabic','Geeza Pro',Tahoma,Arial,sans-serif;">تأكيد الحساب</a>
          </td></tr></table>
          <p style="font-size:13px;line-height:1.8;margin:24px 0 0;color:#9aa3b5;">الرابط صالح لمدة محدودة.</p>
        </td></tr>
        <tr><td dir="rtl" style="padding:24px 28px 28px;text-align:right;font-family:-apple-system,'SF Arabic','Geeza Pro',Tahoma,Arial,sans-serif;font-size:12px;line-height:1.7;color:#6f788a;border-top:1px solid #1b2438;">
          افتح هذا الرابط من جهاز iPhone المثبّت عليه تطبيق «قُدرة».<br>
          إذا لم تطلب هذا الإجراء يمكنك تجاهل الرسالة بأمان.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
