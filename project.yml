# مواصفات مشروع Xcode — تُولِّد Qudra.xcodeproj عبر XcodeGen:
#   brew install xcodegen && xcodegen generate
name: Qudra
options:
  bundleIdPrefix: com.qudra
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  QudraEngine:
    path: Packages/QudraEngine

targets:
  Qudra:
    type: application
    platform: iOS
    sources:
      - path: Qudra
        excludes:
          - "Config/*.xcconfig"
    configFiles:
      Debug: Qudra/Config/Qudra.xcconfig
      Release: Qudra/Config/Qudra.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - package: QudraEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qudra.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Qudra/Info.plist
      properties:
        CFBundleDisplayName: "قُدرة"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.qudra.app.auth
            CFBundleURLSchemes: [qudra]
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        QUDRA_SUPPORT_EMAIL: $(QUDRA_SUPPORT_EMAIL)

  QudraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QudraTests
    dependencies:
      - target: Qudra
      - package: QudraEngine

schemes:
  Qudra:
    build:
      targets:
        Qudra: all
        QudraTests: [test]
    test:
      targets:
        - QudraTests
